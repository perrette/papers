[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "papers-cli"
authors = [
    {name = "Mahé Perrette", email = "mahe.perrette@gmail.com"},
]
description='utilities to keep your PDF library organized'
readme = "README.md"
requires-python = ">=3.11"
keywords = ['bibtex', 'references','bibliography']
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    # PyMuPDF 2.0 has no wheel for free-threaded python and does not build
    # from source there; pymupdf-lite 2.0 (the same pymupdf module, without
    # the layout/LLM features) has free-threaded wheels for linux x86_64 only,
    # and no source distribution. 1.28 has a 3.14t wheel, but none for 3.15t.
    # See https://github.com/pymupdf/PyMuPDF/issues/5170
    "PyMuPDF<2; python_version < '3.15' or sys_platform != 'linux' or platform_machine != 'x86_64'",
    "pymupdf-lite>=2; python_version >= '3.15' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "unidecode",
    "bibtexparser>=2.0.0b2",
    "scholarly",
    "rapidfuzz",
    "python-slugify",
    "requests",
    "beautifulsoup4",
    "platformdirs",
]
dynamic = ["version"]

[project.optional-dependencies]
docs = [
    # Pin below MkDocs 2.0: that release drops the plugin/theme/config system
    # with no migration path and is incompatible with Material for MkDocs.
    # The 1.x line is stable and is what Material targets.
    "mkdocs>=1.5,<2",
    "mkdocs-material>=9.5",
    "mkdocs-include-markdown-plugin>=6.0",
    # one folder per version on gh-pages, and the version selector of Material
    "mike>=2.1",
]

[project.urls]
homepage = "https://github.com/perrette/papers"
Documentation = "https://perrette.github.io/papers/"

[tool.setuptools]
# explicit: auto-discovery fails on stray top-level dirs (site/, notes/...)
packages = ["papers", "papers.cli"]

[tool.setuptools_scm]
write_to = "papers/_version.py"

[project.scripts]
papers = "papers.__main__:main_clean_exit"
# unambiguous alternative for systems where `papers` clashes with the
# GNOME Papers document viewer (issue #107)
papers-cli = "papers.__main__:main_clean_exit"

[tool.tox]
# Tox (https://tox.readthedocs.io/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.
legacy_tox_ini = """
[tox]
envlist = clean, py311, py312, py313, py314, py315, report

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.14t: py314t
    3.15: py315
    3.15t: py315t

[testenv]
commands = pytest --cov=papers --cov-append --cov-report=term-missing {posargs} -xv
deps =
    pytest
    pytest-cov
depends =
    {py311,py312,py313,py314,py314t,py315,py315t}: clean
    report: py311,py312,py313,py314,py314t,py315,py315t


[testenv:report]
deps = coverage
skip_install = true
commands =
    coverage report
    coverage html


[testenv:clean]
deps = coverage
skip_install = true
commands =
    coverage erase

[pytest]
norecursedirs =
      .tox
      .git
"""
