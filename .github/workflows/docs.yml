name: docs

# Each branch deploys its own version of the site with mike: one folder per
# version on the gh-pages branch, and a version selector on every page.
#   master -> 2.x, aliased "stable" (the default version: /papers/ redirects there)
#   v3     -> 3.0-beta
on:
  push:
    branches: [master, v3]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

# deployments commit to gh-pages: one at a time
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Cache mkdocs-material assets
        uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ github.sha }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install .[docs]
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages || true
      - name: Deploy 2.x (master)
        if: github.ref_name == 'master'
        run: |
          mike deploy --push --update-aliases --title "2.x (stable)" 2.x stable
          mike set-default --push stable
      - name: Deploy 3.0-beta (v3)
        if: github.ref_name == 'v3'
        run: mike deploy --push --title "3.0 (beta)" 3.0-beta
