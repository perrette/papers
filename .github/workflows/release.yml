name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Fetch all history for changelog generation

    - name: Get tag name
      id: tag
      run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Release notes
      id: notes
      run: |
        TAG=${{ steps.tag.outputs.tag }}
        NOTES=.github/release-notes/$TAG.md
        if [ -f "$NOTES" ]; then
          # notes written for this release
          cp "$NOTES" body.md
        else
          # otherwise the commits since the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          printf '## Changes in %s\n\n%s\n' "$TAG" "$CHANGES" > body.md
        fi
        # a version with a, b, rc or dev (e.g. v3.0.0b1) is a pre-release
        if echo "$TAG" | grep -Eq '[0-9](a|b|rc|\.dev)[0-9]*$'; then
          echo "prerelease=true" >> $GITHUB_OUTPUT
        else
          echo "prerelease=false" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        release_name: Release ${{ steps.tag.outputs.tag }}
        body_path: body.md
        draft: false
        prerelease: ${{ steps.notes.outputs.prerelease }}
